<!DOCTYPE html>
<html>
<head>
    <title>Create MerakiART Favicon</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f5f5f5;
        }
        canvas { 
            border: 1px solid #ccc; 
            margin: 10px;
            background: white;
        }
        .download-section {
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>MerakiART Favicon Generator</h1>
    
    <div class="download-section">
        <h3>Generated Favicons:</h3>
        <canvas id="favicon16" width="16" height="16"></canvas>
        <canvas id="favicon32" width="32" height="32"></canvas>
        <canvas id="favicon48" width="48" height="48"></canvas>
        
        <br><br>
        
        <button onclick="downloadFavicon(16)">Download 16x16 PNG</button>
        <button onclick="downloadFavicon(32)">Download 32x32 PNG</button>
        <button onclick="downloadFavicon(48)">Download 48x48 PNG</button>
        
        <br><br>
        
        <p><strong>Instructions:</strong></p>
        <ol>
            <li>Click the download buttons to get PNG files</li>
            <li>Use an online converter like <a href="https://favicon.io/favicon-converter/" target="_blank">favicon.io</a> to convert to ICO</li>
            <li>Or rename the 32x32 PNG to "favicon.ico" for basic support</li>
        </ol>
    </div>

    <script>
        function drawFavicon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#F2f1f0';
            ctx.fillRect(0, 0, size, size);
            
            // Letter M
            ctx.fillStyle = '#768C45';
            ctx.font = `bold ${Math.floor(size * 0.7)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('M', size/2, size/2);
        }
        
        function downloadFavicon(size) {
            const canvas = document.getElementById(`favicon${size}`);
            const link = document.createElement('a');
            link.download = `favicon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Draw favicons when page loads
        window.onload = function() {
            drawFavicon(document.getElementById('favicon16'), 16);
            drawFavicon(document.getElementById('favicon32'), 32);
            drawFavicon(document.getElementById('favicon48'), 48);
        };
    </script>
</body>
</html>

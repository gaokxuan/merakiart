<!DOCTYPE html>
<html>
<head>
    <title>Favicon Test - MerakiART</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f5f5f5;
        }
        .favicon-preview {
            display: inline-block;
            margin: 10px;
            text-align: center;
        }
        .favicon-size {
            border: 1px solid #ccc;
            background: white;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>MerakiART Favicon Preview</h1>
    
    <div class="favicon-preview">
        <h3>32x32 pixels</h3>
        <div class="favicon-size">
            <img src="favicon.svg" width="32" height="32" alt="Favicon 32px">
        </div>
    </div>
    
    <div class="favicon-preview">
        <h3>16x16 pixels (actual browser tab size)</h3>
        <div class="favicon-size">
            <img src="favicon.svg" width="16" height="16" alt="Favicon 16px">
        </div>
    </div>
    
    <div class="favicon-preview">
        <h3>24x24 pixels</h3>
        <div class="favicon-size">
            <img src="favicon.svg" width="24" height="24" alt="Favicon 24px">
        </div>
    </div>
    
    <p><strong>Colors:</strong></p>
    <ul>
        <li>Background: #F2f1f0 (Cream)</li>
        <li>Letter M: #768C45 (Sage Green)</li>
    </ul>
    
    <p><strong>To test:</strong> Open this file in your browser to see how the favicon looks at different sizes.</p>
</body>
</html>
